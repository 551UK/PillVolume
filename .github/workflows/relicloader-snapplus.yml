name: Build RelicLoader SnapPlus Helper

on:
  push:
    branches:
      - relicloader-snapplus-build
    paths:
      - 'RelicSnapPlus.m'
      - '.github/workflows/relicloader-snapplus.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 iOS dylib
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -framework Foundation \
            -framework UIKit \
            -Wl,-install_name,/var/jb/usr/lib/TweakInject/relicloader_snapplus.dylib \
            -o relicloader_snapplus.dylib \
            RelicSnapPlus.m
          codesign -f -s - relicloader_snapplus.dylib
          file relicloader_snapplus.dylib
          codesign -dv --verbose=2 relicloader_snapplus.dylib 2>&1 || true

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: relicloader-snapplus-helper
          path: relicloader_snapplus.dylib
