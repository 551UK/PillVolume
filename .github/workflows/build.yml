name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.11
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.11
          name: PillVolume v0.1.11
          body: |
            Settings blank-page fix and Lock Screen restore.

            - Builds the settings page in code so it no longer depends on Root.plist loading correctly
            - Keeps Master Enabled, GitHub Repo, and Respring inside the settings pane
            - Adds a standard PreferenceLoader icon path fallback plus the SF speaker symbol key
            - Uses an explicit preference bundle Info.plist and root resources
            - Restores Lock Screen pill display by attaching to the Lock Screen window when the Cover Sheet host is visible
            - Keeps Apple's native Lock Screen volume path running so volume can still move up/down
            - Mirrors native volume changes after the real button handling instead of replacing them
            - Keeps darker green fill, bigger/bolder white icon, and Home Screen stock HUD suppression
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
