name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.5
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.5
          name: PillVolume v0.1.5
          body: |
            First-press and placement polish.

            - Fixes the delay where the pill could need several volume presses before appearing
            - Builds and attaches the overlay immediately when already on SpringBoard's main thread
            - Moves the pill slightly right and up
            - Makes the pill slightly larger than v0.1.4 while keeping it inside the left notch ear
            - Keeps 32 smaller volume steps for smoother movement
            - Keeps the high-level transparent SpringBoard overlay window for Home Screen and Lock Screen display
            - Still suppresses the stock iOS volume HUD
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
