name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate settings icon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          data = base64.b64decode(Path('assets/PillVolume.png.b64').read_text())
          targets = [
              Path('layout/Library/PreferenceLoader/Preferences/PillVolume.png'),
              Path('PillVolumePrefs/layout/Library/PreferenceLoader/Preferences/PillVolume.png'),
              Path('PillVolumePrefs/Resources/icon.png'),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.13
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.13
          name: PillVolume v0.1.13
          body: |
            Settings crash fix and Lock Screen cleanup.

            - Stops injecting the main SpringBoard tweak into Preferences, which was the likely Settings crash cause
            - Removes Cover Sheet / Lock Screen view hooks and Lock Screen overlay injection
            - Keeps stock iOS Lock Screen volume behaviour instead of forcing a custom HUD there
            - Keeps the custom pill on Home Screen/apps only
            - Simplifies the settings buttons to safer normal Preference specifier actions
            - Keeps Master Enabled working
            - Keeps GitHub Repo and Respring buttons
            - Keeps a generated PNG settings-list icon packaged with PreferenceLoader
            - Keeps native hold volume support
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
