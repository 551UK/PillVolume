name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: pillvolume-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.2
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.2
          name: PillVolume v0.1.2
          body: |
            Placement and Lock Screen rebuild.

            - Uses its own high-level transparent SpringBoard overlay window instead of borrowing random SpringBoard windows
            - Shows on the Lock Screen / cover sheet as well as the Home Screen
            - Preloads the overlay after SpringBoard launches so first volume press should not lag
            - Moves the pill lower and trims the height so it sits properly in the left status-bar/notch row
            - Still suppresses the stock iOS volume HUD
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
