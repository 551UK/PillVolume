name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.8
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.8
          name: PillVolume v0.1.8
          body: |
            Settings and Lock Screen attempt.

            - Adds a clear Master Enabled switch in tweak settings
            - Adds a GitHub Repo button in tweak settings
            - Adds a small speaker icon to the tweak settings title
            - Hides the overlay immediately when the master switch is turned off
            - Tries a stronger Lock Screen route with a much higher overlay window level
            - Re-prepares the overlay on Cover Sheet / Lock Screen appearance
            - Keeps the darker green fill, bigger/bolder white icon, and native hold-volume support
            - Still suppresses the stock iOS volume HUD when enabled
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
