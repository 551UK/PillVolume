name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate settings icon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          data = base64.b64decode(Path('assets/PillVolume.png.b64').read_text())
          targets = [
              Path('layout/Library/PreferenceLoader/Preferences/PillVolume.png'),
              Path('PillVolumePrefs/layout/Library/PreferenceLoader/Preferences/PillVolume.png'),
              Path('PillVolumePrefs/Resources/icon.png'),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.14
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.14
          name: PillVolume v0.1.14
          body: |
            Compact pill volume button.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_TAG: v0.1.14
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          keep_tag = os.environ['KEEP_TAG']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return response.read().decode('utf-8')

          releases = json.loads(request(f'https://api.github.com/repos/{repo}/releases?per_page=100'))
          for release in releases:
              tag = release.get('tag_name')
              if tag == keep_tag:
                  continue
              request(release['url'], 'DELETE')
              if tag:
                  try:
                      request(f'https://api.github.com/repos/{repo}/git/refs/tags/{tag}', 'DELETE')
                  except urllib.error.HTTPError:
                      pass
          PY
