name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.10
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.10
          name: PillVolume v0.1.10
          body: |
            Settings visibility and safer Lock Screen volume handling.

            - Adds preference bundle resources explicitly so Root.plist and Info.plist are packaged
            - Adds CFBundleExecutable / display metadata to the preference bundle
            - Uses a standard PreferenceLoader entry with bundle, detail, and controller keys
            - Keeps the Master Enabled switch, GitHub Repo button, and speaker settings icon
            - Stops preparing/showing the pill just from Lock Screen state changes, preventing a stuck frozen pill
            - Uses the Cover Sheet host view instead of attaching directly to the whole Lock Screen window
            - Lets Apple's native Lock Screen volume path continue while the custom pill mirrors it
            - Removes extra custom volume-step handling from the button hooks so hold-to-change stays native
            - Keeps darker green fill, bigger/bolder white icon, and Home Screen stock HUD suppression
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
