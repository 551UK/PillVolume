name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate settings icon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          data = base64.b64decode(Path('assets/PillVolume.png.b64').read_text())
          targets = [
              Path('layout/Library/PreferenceLoader/Preferences/PillVolume.png'),
              Path('PillVolumePrefs/layout/Library/PreferenceLoader/Preferences/PillVolume.png'),
              Path('PillVolumePrefs/Resources/icon.png'),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.12
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.12
          name: PillVolume v0.1.12
          body: |
            Settings actions, settings icon, and Lock Screen volume mirroring.

            - Fixes the GitHub Repo button using buttonAction plus a tap fallback
            - Fixes the Respring button using sbreload first, then killall fallback
            - Adds a real generated PNG settings-list icon, not just an SF symbol key
            - Packages the settings icon into PreferenceLoader and the preference bundle
            - Keeps Master Enabled working
            - Improves Lock Screen volume mirroring by reading the active category and effective volume after native button handling
            - Hooks native volume update paths so the Lock Screen pill should move with held volume presses
            - Keeps Apple's native Lock Screen volume handling running instead of replacing it
            - Keeps darker green fill, bigger/bolder white icon, and Home Screen stock HUD suppression
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
