name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillVolume-rootless-v0.1.9
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.9
          name: PillVolume v0.1.9
          body: |
            Settings visibility and Lock Screen host injection.

            - Fixes the PreferenceLoader entry by also installing it from the root package layout
            - Simplifies the PreferenceLoader entry so the PillVolume pane should appear in tweak settings
            - Keeps the Master Enabled switch
            - Keeps the GitHub Repo button
            - Keeps the speaker icon in the settings title and requests a speaker symbol for the settings list entry
            - Changes the Lock Screen approach from only a high floating window to direct Cover Sheet / Lock Screen host injection
            - Hooks Cover Sheet view/controller paths and adds the pill directly to the Lock Screen window when available
            - Keeps darker green fill, bigger/bolder white icon, and native hold-volume support
            - Still suppresses the stock iOS volume HUD when enabled
            - Rootless Dopamine / iOS 16
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
